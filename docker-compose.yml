# Unified Full-Stack Docker Compose for Automated E-Commerce Deployment Platform
include:
  - path: backend/docker-compose.yml

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - apigateway
    networks:
      - flowers-network
